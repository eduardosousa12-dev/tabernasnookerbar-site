<!-- ============ Fotos (todas reais, tiradas do vídeo e das fotos da casa) ============ -->
<section class="section" id="fotos" aria-labelledby="fotos-titulo">
  <div class="container">
    <div class="section-head tone-red" data-reveal>
      <span class="eyebrow">Fotos</span>
      <h2 id="fotos-titulo">É assim numa noite de jogo.</h2>
    </div>

    <div class="gallery" data-reveal>
      <figure class="gallery__item gallery__item--tall">
        <img
          src="assets/img/salao-taberna-snooker-bar-uberlandia-560.webp"
          srcset="assets/img/salao-taberna-snooker-bar-uberlandia-560.webp 560w, assets/img/salao-taberna-snooker-bar-uberlandia.webp 960w"
          sizes="(min-width: 1024px) 34vw, 100vw"
          width="960"
          height="1052"
          alt="Vista aérea do {{site.name}} à noite: o telão verde na fachada e o salão cheio de mesas amarelas"
          loading="lazy"
          decoding="async"
        />
        <figcaption>O salão visto de cima, com o telão na entrada.</figcaption>
      </figure>

      <figure class="gallery__item gallery__item--wide">
        <img
          src="assets/img/mesas-de-sinuca-taberna-snooker-bar-uberlandia.webp"
          width="720"
          height="400"
          alt="Mesas de sinuca do {{site.name}} com clientes jogando"
          loading="lazy"
          decoding="async"
        />
        <figcaption>As 6 mesas de sinuca. Ficha a {{prices.token}}.</figcaption>
      </figure>

      <figure class="gallery__item">
        <img
          src="assets/img/galeria/salao-cheio-dia-de-jogo-taberna-snooker-bar-uberlandia.webp"
          width="600"
          height="800"
          alt="Salão do {{site.name}} lotado, com o telão ligado e a torcida nas mesas"
          loading="lazy"
          decoding="async"
        />
        <figcaption>Dia de jogo. Todos os jogos do seu time, em HD.</figcaption>
      </figure>

      <figure class="gallery__item">
        <img
          src="assets/img/galeria/jogando-sinuca-taberna-snooker-bar-uberlandia.webp"
          width="600"
          height="800"
          alt="Cliente jogando sinuca no {{site.name}}"
          loading="lazy"
          decoding="async"
        />
        <figcaption>Sinuca.</figcaption>
      </figure>

      <figure class="gallery__item">
        <img
          src="assets/img/galeria/turma-na-mesa-taberna-snooker-bar-uberlandia.webp"
          width="600"
          height="800"
          alt="Grupo de amigos sorrindo numa mesa amarela do {{site.name}}"
          loading="lazy"
          decoding="async"
        />
        <figcaption>A turma.</figcaption>
      </figure>

      <figure class="gallery__item">
        <img
          src="assets/img/galeria/torcida-taberna-snooker-bar-uberlandia.webp"
          width="600"
          height="800"
          alt="Torcedores com camisa de time no {{site.name}}"
          loading="lazy"
          decoding="async"
        />
        <figcaption>A torcida.</figcaption>
      </figure>

      <a class="gallery__more" href="{{site.instagram}}" target="_blank" rel="noopener">
        <svg class="icon" aria-hidden="true"><use href="#i-instagram" /></svg>
        <span>Mais fotos e os jogos da semana no <b>@tabernasnookerbar</b></span>
      </a>
    </div>
  </div>
</section>
